{% extends 'base.html' %}{% block content %}<h1>Edytuj sekcję</h1><form class="form cardbox" method="post"><label>Nazwa sekcji<input name="name" required value="{{section.name}}"></label><label>Jednostka<input name="unit" value="{{section.unit}}" placeholder="np. m³, kWh, szt."></label><label>Notatki<input name="notes" value="{{section.notes}}"></label><input type="hidden" name="month" value="{{request.args.get('month','')}}"><button class="btn primary">Zapisz</button></form>{% endblock %}
