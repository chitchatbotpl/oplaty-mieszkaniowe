{% extends 'base.html' %}
{% block content %}
<div class="top"><div><a class="back" href="{{url_for('apartment_detail',apartment_id=section.apartment_id,month=month)}}">← Wróć</a><h1>{{'Edytuj odczyt' if reading else 'Dodaj odczyt'}}</h1><p class="muted">Sekcja: <b>{{section.section_name if reading else section.name}}</b>{% if section.unit %} · jednostka: <b>{{section.unit}}</b>{% endif %}</p></div></div>
<form class="form cardbox" method="post">
<label>Rok i miesiąc<input type="month" name="period" required value="{{reading.period if reading else month}}" aria-label="Wybierz rok i miesiąc"></label>
<div class="two">
<label>Aktualny odczyt {% if section.unit %}<small>({{section.unit}})</small>{% endif %}<input type="number" step="0.001" name="reading" value="{{reading.reading if reading and reading.reading is not none else ''}}"></label>
<label>Poprzedni odczyt {% if section.unit %}<small>({{section.unit}})</small>{% endif %}<input type="number" step="0.001" name="previous_reading" value="{{reading.previous_reading if reading and reading.previous_reading is not none else ''}}"></label>
</div>
<div class="two">
<label>Zużycie {% if section.unit %}<small>({{section.unit}})</small>{% endif %} <small>— jeśli puste, policzy się automatycznie</small><input type="number" step="0.001" name="consumption" value="{{reading.consumption if reading and reading.consumption is not none else ''}}"></label>
<label>Stawka za jednostkę {% if section.unit %}<small>({{section.unit}})</small>{% endif %}<input type="number" step="0.0001" name="rate" value="{{reading.rate if reading and reading.rate is not none else ''}}"></label>
</div>
<label class="checkbox"><input type="checkbox" name="no_payment" id="no_payment" {% if reading and reading.no_payment %}checked{% endif %}> Brak płatności w tym miesiącu — bez kwoty i odczytu</label>
<label>Kwota do zapłaty (zł)<input type="number" step="0.01" min="0" name="amount_due" value="{{reading.amount_due if reading and not reading.no_payment else ''}}"></label>
<label class="checkbox"><input type="checkbox" name="paid" {% if reading and reading.paid %}checked{% endif %}> Oznacz jako opłacone</label>
<div class="two">
<label>Termin płatności<input type="date" name="payment_due_date" value="{{ reading.payment_due_date or '' if reading else '' }}"><small>Termin dotyczy tylko tego odczytu.</small></label>
<label>Data zapłaty<input type="date" name="paid_date" value="{{reading.paid_date or '' if reading else ''}}"></label>
</div>
<label>Notatki<textarea name="notes">{{reading.notes if reading else ''}}</textarea></label>
<button class="btn primary">Zapisz odczyt</button>
</form>
<script>
const noPayment = document.getElementById("no_payment");
noPayment?.addEventListener("change", () => {
  const disabled = noPayment.checked;
  for (const name of ["reading", "previous_reading", "consumption", "rate", "amount_due", "payment_due_date", "paid_date"]) {
    const field = document.querySelector(`[name="${name}"]`);
    if (field) { field.disabled = disabled; if (disabled) field.value = ""; }
  }
  const paid = document.querySelector(`[name="paid"]`);
  if (paid) { if (disabled) paid.checked = true; else paid.checked = false; paid.disabled = disabled; }
});
if (noPayment?.checked) noPayment.dispatchEvent(new Event("change"));
</script>
{% endblock %}
