{% extends "base.html" %}{% block content %}<div class="top"><h1>Mieszkania</h1></div><div class="formcard" style="margin-bottom:18px"><h3>Dodaj mieszkanie</h3><form method="post" class="formgrid"><div class="field"><label>Nazwa</label><input name="name" placeholder="np. Mieszkanie 04" required></div><div class="field"><label>Adres</label><input name="address"></div><div class="field"><label>Właściciel / najemca</label><input name="owner"></div><div class="field"><label>Uwagi</label><input name="notes"></div><div><button class="btn">Dodaj</button></div></form></div><div class="tablebox"><table><tr><th>Nazwa</th><th>Adres</th><th>Osoba</th><th>Status</th><th></th></tr>{% for a in apartments %}<tr><td>{{a.name}}</td><td>{{a.address}}</td><td>{{a.owner}}</td><td>{{"Aktywne" if a.active else "Nieaktywne"}}</td><td><form method="post" action="{{url_for('toggle_apartment',apartment_id=a.id)}}"><button class="btn gray">{{"Dezaktywuj" if a.active else "Aktywuj"}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
