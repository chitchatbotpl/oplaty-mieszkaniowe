{% extends 'base.html' %}{% block content %}<div class="top"><h1>{{'Edytuj mieszkanie' if apartment else 'Dodaj mieszkanie'}}</h1><a href="{{url_for('index')}}">← Wróć</a></div><form class="form cardbox" method="post"><label>Nazwa mieszkania<input name="name" required value="{{apartment.name if apartment else ''}}"></label><label>Adres<input name="address" value="{{apartment.address if apartment else ''}}"></label><label>Właściciel<input name="owner" value="{{apartment.owner if apartment else ''}}"></label><label>Notatki<textarea name="notes">{{apartment.notes if apartment else ''}}</textarea></label><button class="btn primary">Zapisz</button></form>{% endblock %}
